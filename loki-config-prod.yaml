auth_enabled: false
server:
  grpc_listen_port: 9095
  http_listen_port: 3100

common:
  path_prefix: /var/loki
  replication_factor: 3
  storage:
    s3:
      bucketnames: figured-production-loki-analytics-chunks
      insecure: false
      region: us-west-2
      s3forcepathstyle: false
limits_config:
  enforce_metric_name: false
  max_cache_freshness_per_query: 10m
  max_global_streams_per_user: 0
  max_streams_per_user: 0
  reject_old_samples: false
  reject_old_samples_max_age: 100000h
  split_queries_by_interval: 15m
memberlist:
  join_members:
    - loki-memberlist
query_range:
  align_queries_with_step: true
ruler:
  storage:
    s3:
      bucketnames: figured-production-loki-ruler
      insecure: false
      region: us-west-2
      s3forcepathstyle: false
    type: s3

schema_config:
  configs:
    - from: "2022-01-11"
      index:
        period: 24h
        prefix: loki_index_
      object_store: s3
      schema: v12
      store: boltdb-shipper

storage_config:
  hedging:
    at: 250ms
    max_per_second: 20
    up_to: 3